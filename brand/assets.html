<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(../assets/fonts/Anton.ttf)}
@font-face{font-family:Bodoni;src:url(../assets/fonts/BodoniModa-Black.ttf)}
*{margin:0;box-sizing:border-box}
body{background:#000}
.card{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#1a0507 0%,#060606 55%,#000 100%);color:#fff;font-family:Anton}
.card::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px);pointer-events:none}
.streak{position:absolute;height:6px;background:linear-gradient(90deg,transparent,#e10600 40%,#ff3b2f 60%,transparent);filter:blur(1px);box-shadow:0 0 30px #e10600}
#pfp{width:1080px;height:1080px;display:flex;align-items:center;justify-content:center;flex-direction:column}
#pfp .mono{font-size:470px;line-height:.9;letter-spacing:-6px;position:relative;z-index:2}
#pfp .mono span{color:#e10600}
#pfp .sub{font-family:Bodoni;font-size:92px;letter-spacing:34px;margin-top:20px;padding-left:34px;z-index:2}
#banner{width:2560px;height:1440px;display:flex;align-items:center;justify-content:center;flex-direction:column}
#banner .t{font-size:300px;letter-spacing:8px;line-height:1;z-index:2}
#banner .t span{color:#e10600}
#banner .tag{font-family:Bodoni;font-size:64px;letter-spacing:22px;margin-top:18px;color:#ddd;z-index:2}
</style></head><body>
<div id="pfp" class="card"><div class="streak" style="width:1400px;left:-160px;top:610px;transform:rotate(-8deg)"></div>
<div class="mono">V<span>12</span></div><div class="sub">MOTION</div></div>
<div id="banner" class="card"><div class="streak" style="width:3000px;left:-200px;top:1010px;transform:rotate(-3deg)"></div>
<div class="t">V<span>12</span> MOTION</div><div class="tag">SUPERCAR EDITS · DAILY</div></div>
</body></html>
